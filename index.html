    <script>
      (function () {
        // Preserve original addEventListener behavior but default certain events to passive
        try {
          var originalAddEventListener = EventTarget.prototype.addEventListener;
          var passiveEvents = {
            touchstart: true,
            touchmove: true,
            wheel: true,
            mousewheel: true,
          };

          EventTarget.prototype.addEventListener = function (
            type,
            listener,
            options,
          ) {
            try {
              if (
                passiveEvents[type] &&
                (options === undefined || options === false)
              ) {
                options = { passive: true };
              }
              return originalAddEventListener.call(
                this,
                type,
                listener,
                options,
              );
            } catch (err) {
              // In very rare cases, 3rd-party scripts may tamper with prototypes; fail silently
              return originalAddEventListener.call(
                this,
                type,
                listener,
                options,
              );
            }
          };
        } catch (ex) {
          // If prototypes are locked down, continue without the passive defaults
        }

        function isInjectedShareModalError(event) {
          try {
            var msg =
              String(event && (event.message || event.reason || '')) || '';
            var src =
              String(
                event &&
                  (event.filename ||
                    (event.reason && event.reason.stack) ||
                    ''),
              ) || '';
            // Check common places for the identifier and the common null-read message
            if (
              msg.indexOf('Cannot read properties of null') !== -1 &&
              src.indexOf('share-modal.js') !== -1
            )
              return true;
            if (msg.indexOf('share-modal.js') !== -1) return true;
            if (src.indexOf('share-modal.js') !== -1) return true;
          } catch (err) {
            // ignore
          }
          return false;
        }

        window.addEventListener(
          'error',
          function (event) {
            if (isInjectedShareModalError(event)) {
              try {
                event.preventDefault();
              } catch (e) {}
              try {
                event.stopImmediatePropagation();
              } catch (e) {}
              return;
            }
          },
          true,
        );

        window.addEventListener(
          'unhandledrejection',
          function (event) {
            if (isInjectedShareModalError(event)) {
              try {
                event.preventDefault();
              } catch (e) {}
              return;
            }
          },
          true,
        );

        // Back-compat global handler
        var oldOnError = window.onerror;
        window.onerror = function (message, source, lineno, colno, error) {
          var evt = { message: message, filename: source, error: error };
          if (isInjectedShareModalError(evt)) return true;
          if (typeof oldOnError === 'function')
            return oldOnError(message, source, lineno, colno, error);
          return false;
        };
      })();
    </script>
